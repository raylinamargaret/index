<!DOCTYPE html>
<html>
<head>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 800px;
      margin: 20px auto;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fbf9f1;
    }

    td {
      border: 2px solid #333;
      text-align: center;
      vertical-align: middle;
      font-weight: bold;
      font-size: 18px;
      height: 50px;
      color: #333;
    }

    .cell-a { background-color: #ffecd2; }
    .cell-b { background-color: #fcb69f; }
    .cell-c { background-color: #a1c4fd; }
    .cell-d { background-color: #c2e9fb; }
    .cell-e { background-color: #d4fc79; }
    .cell-f { background-color: #96e6a1; }
    .cell-g { background-color: #fccb90; }
    .cell-h { background-color: #e2b0ff; }
    .cell-i { background-color: #ff9a9e; }
    .cell-j { background-color: #fecfef; }
    .cell-k { background-color: #a8edea; }
    .cell-m { background-color: #fed6e3; }
    .cell-n { background-color: #e0c3fc; }
    .cell-o { background-color: #8ec5fc; }
    .cell-p { background-color: #ffd1ff; }
    .cell-q { background-color: #c2ffd8; }
    .cell-r { background-color: #fdcbf1; }
    .cell-u { background-color: #e6dee9; }
    .cell-v { background-color: #fff1eb; }
    .cell-w { background-color: #ace0f9; }
  </style>
</head>
<body>

  <h2 style="text-align: center; color: #444; font-family: sans-serif;">Table Merge</h2>

  <table>
    <tr>
      <td rowspan="2" colspan="2" class="cell-a">A</td>
      <td colspan="2" class="cell-b">B</td>
      <td colspan="3" class="cell-c">C</td>
      <td rowspan="3" class="cell-d">D</td>
      <td rowspan="2" colspan="2" class="cell-e">E</td>
    </tr>
    <tr>
      <td colspan="2" class="cell-f">F</td>
      <td colspan="3" class="cell-g">G</td>
    </tr>
    <tr>
      <td rowspan="2" class="cell-h">H</td>
      <td colspan="3" class="cell-i">I</td>
      <td colspan="3" class="cell-j">J</td>
      <td colspan="2" class="cell-k">K</td>
    </tr>
    <tr>
      <td colspan="4" class="cell-m">M</td>
      <td colspan="4" class="cell-n">N</td>
      <td rowspan="2" class="cell-o">O</td>
    </tr>
    <tr>
      <td colspan="2" class="cell-p">P</td>
      <td colspan="3" class="cell-q">Q</td>
      <td colspan="3" class="cell-r">R</td>
    </tr>
    <tr>
      <td colspan="4" class="cell-u">U</td>
      <td colspan="3" class="cell-v">V</td>
      <td colspan="3" class="cell-w">W</td>
    </tr>
  </table>

</body>
</html>
