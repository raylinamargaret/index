<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My HTML Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 8px;
            padding: 0;
            border: 2px solid #7c9082;
            font-family: Verdana, sans-serif;
        }

        .header {
            background-color: #f4c2c2;
            padding: 20px;
            text-align: center;
            color: #4a5d53;
        }

        .header h1 {
            font-size: 30px;
        }

        .navbar {
            display: flex;
            background-color: #8da399;
        }

        .navbar a {
            color: #fff9f5;
            padding: 14px 16px;
            text-decoration: none;
            transition: 0.3s;
        }

        .navbar a:hover {
            background-color: #f4c2c2;
            color: #4a5d53;
        }

        .navbar a.active {
            background-color: #f4c2c2;
            color: #4a5d53;
        }

        .content {
            background-color: #f9f6f0;
            padding: 10px;
        }

        iframe {
            width: 100%;
            height: 750px;
            border: none;
            display: block;
            background-color: #f9f6f0;
        }

        .footer {
            background-color: #f4c2c2;
            color: #4a5d53;
            padding: 20px;
            text-align: center;
        }

        @media screen and (max-width: 700px) {
            .navbar {
                flex-wrap: wrap;
            }

            .navbar a {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>My Website</h1>
        <p>Welcome to My HTML and CSS Projects! :D</p>
    </div>

    <div class="navbar">
        <a href="sts_92_33.css" target="isi" class="active" onclick="pilih(this)">STS</a>

        <a href="biodata.html" target="isi" onclick="pilih(this)">Biodata</a>

        <a href="table.html" target="isi" onclick="pilih(this)">Tabel</a>

        <a href="list.html" target="isi" onclick="pilih(this)">List</a>
    </div>

    <div class="content">
        <iframe src="sts_92_33.html" name="isi"></iframe>
    </div>

    <div class="footer">
        <p>Created by Raylina 92/33</p>
    </div>

    <script>
        function pilih(link) {
            let menu = document.querySelectorAll(".navbar a");

            menu.forEach(function(item) {
                item.classList.remove("active");
            });

            link.classList.add("active");
        }
    </script>

</body>
</html>
